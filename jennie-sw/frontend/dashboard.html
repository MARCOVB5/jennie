<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Projeto Jennie</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <nav class="navbar">
        <div class="brand">Jennie NAS</div>
        <div class="nav-links">
            <span id="userGreeting">Olá, Admin</span>
            <button id="logoutBtn" class="logout-btn">Sair</button>
        </div>
    </nav>

    <main class="dashboard-container">
        <div class="card">
            <h3>Temperatura CPU</h3>
            <div class="metric" id="cpuTemp">45.0°C</div>
        </div>
        
        <div class="card">
            <h3>Status Sistema</h3>
            <div class="metric" id="batteryStatus">Ativo</div>
            <div class="metric-detail" style="margin-top: 5px;">Conectado à Rede</div>
        </div>

        <div class="card">
            <h3>Memória RAM</h3>
            <div class="metric" id="ramUsage">450 MB</div>
            <div class="metric-detail" id="ramTotal" style="margin-top: 5px;">de 2.0 GB</div>
        </div>

        <div class="card full-width">
            <h3>Armazenamento</h3>
            <div class="progress-bar">
                <div class="progress-fill" style="width: 45%;"></div>
            </div>
            <div class="metric-detail">4.5 TB / 10 TB Usados</div>
        </div>

        <div class="card full-width">
            <div class="file-manager-header">
                <div id="breadcrumbs" style="font-size: 18px; display: flex; align-items: center; gap: 8px;"></div>
                <div>
                    <button class="btn-acao" onclick="criarNovaPasta()" style="background-color: #007BFF; margin-right: 10px; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer;">+ Nova Pasta</button>
                    
                    <input type="file" id="fileUploadInput" style="display: none;">
                    <button class="btn-upload" onclick="document.getElementById('fileUploadInput').click()">+ Enviar Arquivo</button>
                </div>
            </div>
            
            <div id="containerProgresso" style="display: none; margin-top: 10px; background: #e9ecef; border-radius: 4px; padding: 3px;">
                <div id="barraProgresso" style="width: 0%; height: 10px; background: #28a745; border-radius: 4px; transition: width 0.2s;"></div>
                <div id="textoProgresso" style="font-size: 12px; text-align: center; color: #333; margin-top: 2px;">0%</div>
            </div>

            <div id="fileListContainer">
                <p style="color: #a0a0a0; margin-top: 15px;">Carregando arquivos...</p>
            </div>
        </div>

        <div id="meuModal" class="modal-imagem">
            <span class="fechar-modal" onclick="fecharVisualizador()">&times;</span>
            <img class="modal-conteudo" id="imagemAmpliada">
        </div>
    </main>

    <script src="js/dashboard.js"></script>
</body>
</html>
